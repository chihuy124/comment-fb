<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FB Reel Scraper</title>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 14px;
        width: 300px;
        background: #0f1218;
        color: #e5e7eb;
      }
      h1 { font-size: 15px; margin: 0 0 10px; }
      .row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 13px; }
      input[type="number"] {
        width: 70px;
        background: #1a1f2b;
        border: 1px solid #2a3040;
        color: #e5e7eb;
        border-radius: 6px;
        padding: 4px 6px;
      }
      button {
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
        border: 0;
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
        font-weight: 600;
        width: 100%;
        margin-top: 8px;
      }
      .status { font-size: 12px; color: #9ca3af; margin-top: 8px; }
      .ok { color: #22c55e; }
      a { color: #60a5fa; }
    </style>
  </head>
  <body>
    <h1>🧩 FB Reel Comment Scraper</h1>
    <div class="row">
      <label for="concurrent">Số tab song song</label>
      <input type="number" id="concurrent" min="1" max="8" value="3" />
    </div>
    <div class="row">
      <label for="timeout">Timeout mỗi tab (giây)</label>
      <input type="number" id="timeout" min="10" max="120" value="45" />
    </div>
    <div class="row">
      <label for="delay">Delay giữa batch (giây)</label>
      <input type="number" id="delay" min="0" max="30" value="2" />
    </div>
    <button id="save">💾 Lưu cấu hình</button>
    <div class="status ok" id="status">Extension đã sẵn sàng.</div>
    <div class="status">
      Mở <a href="https://comment-fb.vercel.app/" target="_blank">comment-fb.vercel.app</a> → tab Scanner → bấm nút "Cào Comment Thật".
    </div>
    <script src="popup.js"></script>
  </body>
</html>
